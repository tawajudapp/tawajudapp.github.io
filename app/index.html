.av.s{width:40px;height:40px;background:var(--pl);color:var(--pd);font-size:16px}
.hello{font-size:13px;opacity:.85}.nm{font-size:19px;font-weight:800}

h3{margin:16px 2px 8px;font-size:16px}

.li .m{flex:1;min-width:0}.li .t{font-weight:700}.li .s{font-size:12.5px;color:var(--mut)}

label{display:block;font-weight:700;font-size:13px;margin:10px 2px 4px;color:#334155}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--tx)}

.nav .in{max-width:560px;width:100%;display:flex}

.login{padding:30px 18px}.login .logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,var(--pd),var(--p2));display:flex;align-items:center;justify-content:center;font-size:42px;margin:20px auto 10px}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pgrid img{height:130px}
.cd{font-size:44px;font-weight:800;text-align:center;color:var(--bad);direction:ltr}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

    $('#b').innerHTML = '<div class="card"><label>نطاق الحضور الافتراضي للفروع الجديدة (متر)</label><input id="radius" type="number" value="' + esc(s.radius) + '"><div class="row2"><div><label>بداية الدوام</label><input id="shiftStart" type="time" value="' + esc(s.shiftStart) + '"></div><div><label>سماح التأخير (دقيقة)</label><input id="grace" type="number" value="' + esc(s.grace) + '"></div></div><div class="row2"><div><label>أقصى خطأ GPS مقبول (م)</label><input id="maxAcc" type="number" value="' + esc(s.maxAcc) + '"></div><div><label>مهلة التحدي (دقيقة)</label><input id="challengeMinutes" type="number" value="' + esc(s.challengeMinutes) + '"></div></div><div class="row2"><div><label>احتمال التحدي كل 5 دقائق (0-1)</label><input id="challengeProb" type="number" step="0.01" value="' + esc(s.challengeProb) + '"></div><div><label>أقصى تحديات في اليوم</label><input id="maxChallenges" type="number" value="' + esc(s.maxChallenges) + '"></div></div><label>صورة تحقق عند الانصراف</label><select id="requireOutPhoto"><option value="1"' + (s.requireOutPhoto === '1' ? ' selected' : '') + '>مطلوبة</option><option value="0"' + (s.requireOutPhoto === '0' ? ' selected' : '') + '>غير مطلوبة</option></select><br><button class="btn b" id="go">حفظ</button></div>' + (r.sheetUrl ? '<div class="card"><b>قاعدة البيانات (Google Sheets)</b><div class="s" style="font-size:13px;color:var(--mut);margin:6px 0">كل البيانات محفوظة في هذا الملف على حساب جوجل الخاص بك:</div><a class="btn o b" target="_blank" href="' + esc(r.sheetUrl) + '">فتح الجدول</a></div>' : '');
    $('#go').onclick = function () { var p = {}; ['radius', 'shiftStart', 'grace', 'maxAcc', 'challengeMinutes', 'challengeProb', 'maxChallenges', 'requireOutPhoto'].forEach(function (k) { p[k] = $('#' + k).value; }); busy(this, function () { return api('settingsSave', p).then(function () { toast('تم الحفظ'); }); }); };
  }, fail);
};
